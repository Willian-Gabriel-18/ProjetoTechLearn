    <!-- viewport: no celular a página usa a largura da tela. -->

    <!-- body: o que a pessoa vê. -->
    <p>Abra pelo servidor local se o módulo bloquear em file://. O Console mostra 5.</p>

    <script type="module" src="main.js"></script>

</html>
