<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t d">
  <title id="t">Chrome não é o Google</title>
  <desc id="d">À esquerda uma janela do Chrome com uma página. À direita o campo de busca do Google, que vive dentro do Chrome.</desc>
  <rect width="720" height="280" fill="#f4efe6"/>
  <g transform="translate(24,36)">
    <rect width="320" height="210" rx="10" fill="#fff" stroke="#241c15" stroke-width="3"/>
    <rect width="320" height="36" rx="10" fill="#e8e0d4"/>
    <circle cx="22" cy="18" r="6" fill="#C24E1D"/>
    <circle cx="42" cy="18" r="6" fill="#E8C872"/>
    <circle cx="62" cy="18" r="6" fill="#1F6A4A"/>
    <rect x="88" y="10" width="216" height="16" rx="8" fill="#fff" stroke="#241c15" stroke-width="1.5"/>
    <text x="98" y="22" font-family="ui-monospace, monospace" font-size="11" fill="#241c15">arquivo:///pagina.html</text>
    <text x="160" y="90" text-anchor="middle" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="20" fill="#1F6A4A">Chrome</text>
    <text x="160" y="118" text-anchor="middle" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="14" fill="#241c15">o programa da janela</text>
    <text x="160" y="160" text-anchor="middle" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="14" fill="#241c15">abre arquivo e site</text>
  </g>
  <g transform="translate(376,36)">
    <rect width="320" height="210" rx="10" fill="#fff" stroke="#241c15" stroke-width="3"/>
    <text x="160" y="80" text-anchor="middle" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="20" fill="#C24E1D">Google</text>
    <rect x="40" y="100" width="240" height="36" rx="18" fill="#f4efe6" stroke="#241c15" stroke-width="2"/>
    <text x="160" y="123" text-anchor="middle" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="14" fill="#241c15">campo de busca</text>
    <text x="160" y="170" text-anchor="middle" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="14" fill="#241c15">um site, dentro do Chrome</text>
  </g>
</svg>
